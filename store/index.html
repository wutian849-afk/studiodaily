<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STUDIO DAILY — Women's Clothing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── RESET & VARIABLES ───────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #9C8B7A;
      --primary-dark: #7D6F62;
      --secondary: #D4C5B5;
      --accent: #4A4A4A;
      --bg: #FAF8F5;
      --card: #FFFFFF;
      --text: #2C2C2C;
      --text-light: #6B6B6B;
      --border: #E8E2D9;
      --radius: 12px;
      --shadow: 0 2px 16px rgba(0,0,0,0.04);
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }

    /* ─── TYPOGRAPHY ─────────────────────────── */
    h1, h2, h3, h4 { font-family: 'Playfair Display', Georgia, serif; font-weight: 500; line-height: 1.3; }

    /* ─── HEADER ─────────────────────────────── */
    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-logo {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--text);
    }
    .header-logo span { color: var(--primary); }
    .header-nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .header-nav a {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-light);
      transition: color 0.15s;
      cursor: pointer;
    }
    .header-nav a:hover, .header-nav a.active { color: var(--text); }
    .header-cart {
      position: relative;
      cursor: pointer;
      font-size: 20px;
    }
    .header-cart .count {
      position: absolute;
      top: -8px;
      right: -10px;
      background: var(--primary);
      color: white;
      font-size: 10px;
      font-weight: 600;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── HERO ───────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, #F5F0EB 0%, #EDE7E0 100%);
      padding: 80px 24px 64px;
      text-align: center;
    }
    .hero h1 {
      font-size: 44px;
      font-weight: 400;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .hero p {
      color: var(--text-light);
      font-size: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ─── CATEGORY FILTER ────────────────────── */
    .filter-bar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 24px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .filter-btn {
      padding: 8px 20px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: var(--card);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text-light);
    }
    .filter-btn:hover { border-color: var(--primary); color: var(--text); }
    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    /* ─── PRODUCT GRID ───────────────────────── */
    .product-grid {
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 24px 64px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }
    .product-card {
      background: var(--card);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }
    .product-card .image-wrap {
      position: relative;
      overflow: hidden;
      background: #F5F2EE;
    }
    .product-card .image-wrap img {
      width: 100%;
      height: 340px;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .product-card:hover .image-wrap img { transform: scale(1.03); }
    .product-card .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--primary);
      color: white;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .product-card .info {
      padding: 18px 20px 20px;
    }
    .product-card .info h3 {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .product-card .info .category {
      font-size: 11px;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .product-card .info .price {
      font-size: 17px;
      font-weight: 600;
      color: var(--primary-dark);
    }
    .product-card .info .colors {
      font-size: 11px;
      color: var(--text-light);
      margin-top: 6px;
    }

    /* ─── PRODUCT DETAIL MODAL ──────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      padding: 20px;
    }
    .modal-overlay.show { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--card);
      border-radius: 16px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      box-shadow: 0 24px 64px rgba(0,0,0,0.2);
    }
    .modal-image {
      flex: 1 1 340px;
      min-height: 340px;
      background: #F5F2EE;
    }
    .modal-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .modal-content {
      flex: 1 1 360px;
      padding: 36px;
    }
    .modal-content .close-btn {
      float: right;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-light);
    }
    .modal-content h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .modal-content .modal-category {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-light);
      margin-bottom: 12px;
    }
    .modal-content .modal-price {
      font-size: 24px;
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 16px;
    }
    .modal-content .modal-desc {
      font-size: 14px;
      color: var(--text-light);
      line-height: 1.7;
      margin-bottom: 20px;
    }
    .modal-content .option-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: var(--text);
    }
    .modal-content .size-options,
    .modal-content .color-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .modal-content .size-btn,
    .modal-content .color-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .modal-content .size-btn:hover,
    .modal-content .color-btn:hover { border-color: var(--primary); }
    .modal-content .size-btn.selected,
    .modal-content .color-btn.selected {
      background: var(--text);
      border-color: var(--text);
      color: white;
    }
    .color-btn {
      position: relative;
      padding-left: 32px;
    }
    .color-btn .swatch {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid var(--border);
    }
    .modal-content .paypal-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: #FFC439;
      color: #2C2E2F;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-top: 16px;
    }
    .modal-content .paypal-btn:hover { opacity: 0.9; }
    .modal-content .paypal-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ─── FOOTER ─────────────────────────────── */
    .footer {
      border-top: 1px solid var(--border);
      padding: 32px 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text-light);
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ─── RESPONSIVE ────────────────────────── */
    @media (max-width: 768px) {
      .header-inner { padding: 14px 16px; }
      .header-logo { font-size: 18px; letter-spacing: 2px; }
      .header-nav { gap: 16px; }
      .header-nav a { font-size: 11px; letter-spacing: 0.5px; }
      .hero { padding: 48px 16px 40px; }
      .hero h1 { font-size: 28px; }
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 16px 12px 40px; }
      .product-card .image-wrap img { height: 220px; }
      .product-card .info { padding: 12px 14px; }
      .product-card .info h3 { font-size: 13px; }
      .product-card .info .price { font-size: 15px; }
      .modal { flex-direction: column; }
      .modal-image { flex: none; min-height: 280px; }
      .modal-content { padding: 24px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="header-logo">STUDIO <span>DAILY</span></div>
      <nav class="header-nav">
        <a class="active" onclick="filterProducts('all')" data-cat="all">All</a>
        <a onclick="filterProducts('Dresses')" data-cat="Dresses">Dresses</a>
        <a onclick="filterProducts('Tops')" data-cat="Tops">Tops</a>
        <a onclick="filterProducts('Bottoms')" data-cat="Bottoms">Bottoms</a>
        <a onclick="filterProducts('Outerwear')" data-cat="Outerwear">Outerwear</a>
      </nav>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Effortless Style, Everyday</h1>
    <p>Curated women's essentials designed for the modern wardrobe. Timeless pieces crafted with intention.</p>
  </section>

  <!-- FILTER BAR (Mobile friendly) -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" onclick="filterProducts('all')">All</button>
    <button class="filter-btn" onclick="filterProducts('Dresses')">Dresses</button>
    <button class="filter-btn" onclick="filterProducts('Tops')">Tops</button>
    <button class="filter-btn" onclick="filterProducts('Bottoms')">Bottoms</button>
    <button class="filter-btn" onclick="filterProducts('Outerwear')">Outerwear</button>
  </div>

  <!-- PRODUCT GRID -->
  <div class="product-grid" id="productGrid">
    <!-- Rendered by JS -->
  </div>

  <!-- PRODUCT DETAIL MODAL -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <div class="modal-image" id="modalImageWrap">
        <img id="modalImage" src="" alt="" />
      </div>
      <div class="modal-content">
        <button class="close-btn" onclick="closeProductModal()">&times;</button>
        <h2 id="modalName"></h2>
        <div class="modal-category" id="modalCategory"></div>
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-desc" id="modalDesc"></div>

        <div class="option-label">Size</div>
        <div class="size-options" id="sizeOptions"></div>

        <div class="option-label">Color</div>
        <div class="color-options" id="colorOptions"></div>

        <button class="paypal-btn" id="paypalBtn" onclick="paypalBuy()">
          <span>Buy Now with</span>
          <svg viewBox="0 0 36 10" width="48" height="14" fill="#2C2E2F"><path d="M5.88 1.62c-.04.2-.06.34-.1.5L5.0 6.1h2.44c.1 0 .2-.02.26-.12.06-.08.04-.18.06-.28l.56-3.58c.02-.1 0-.2-.06-.28-.06-.08-.16-.12-.26-.12H6.0c-.06 0-.12.04-.14.1l.02.8zM9.84 0c-.04.2-.06.34-.1.5L9.0 4.86c-.02.1-.04.2-.1.28-.06.08-.16.12-.26.12H6.22c-.06 0-.12.04-.14.1l-.02.1-.24 1.52c-.02.1 0 .2.06.28.06.08.16.12.26.12h2.12c.1 0 .2-.02.26-.12.06-.08.04-.18.06-.28l.56-3.58c.02-.1 0-.2-.06-.28-.06-.08-.16-.12-.26-.12H8.0c-.06 0-.12.04-.14.1l-.02.8z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>&copy; 2026 STUDIO DAILY. All rights reserved.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
